name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
        go-version:
          - '1.24'
          - 'stable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run go vet
        run: |
          output=$(go vet -unsafeptr=false ./... 2>&1 | grep -vE 'opuscc|opusccenc' || true)
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi
          echo "go vet passed successfully across all packages."

      - name: Verify 32-bit architecture rejection
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        run: |
          if GOARCH=386 go build ./libcshim 2>/dev/null; then
            echo "Expected GOARCH=386 build to fail due to 64-bit architecture requirement, but it succeeded"
            exit 1
          fi
          echo "32-bit guard successfully rejected build as expected."

      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
        env:
          GODEBUG: gotypesalias=1

      - name: Run Unit Tests with Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        env:
          CGO_ENABLED: 0
        run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

      - name: Run Unit Tests (CGO_ENABLED=0)
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable') }}
        env:
          CGO_ENABLED: 0
        run: go test -v ./...

      - name: Run Race Detector (Unix only)
        if: runner.os != 'Windows'
        run: go test -race -gcflags=all=-d=checkptr=0 -v . ./ogg ./wav ./player ./test ./opus

      - name: Build CLI Tools
        env:
          CGO_ENABLED: 0
        run: go build -v ./cmd/...

  cross-compile:
    name: Cross-Compile (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: go build -v ./...

  conformance:
    name: RFC 6716 Conformance Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache RFC 6716 test vectors
        uses: actions/cache@v4
        with:
          path: testvectors
          key: rfc6716-testvectors-${{ hashFiles('scripts/download_testvectors.sh') }}

      - name: Download & verify test vectors (no-op on cache hit)
        run: bash scripts/download_testvectors.sh

      - name: Run full RFC 6716 conformance matrix
        run: bash scripts/run_conformance.sh

  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all example modules
        run: |
          for dir in examples/*/; do
            echo "Building $dir..."
            (cd "$dir" && go build -o /dev/null .) || exit 1
          done

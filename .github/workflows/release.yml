name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing gets write access by default; only the release job below asks for it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # No cache restore here: a poisoned cache must not influence what gets released.
          cache: false

      - name: Verify Unit Tests
        run: go test -v ./...

      - name: Cache RFC 6716 test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: testvectors
          key: rfc6716-testvectors-${{ hashFiles('scripts/download_testvectors.sh') }}

      - name: Download & verify test vectors (no-op on cache hit)
        run: bash scripts/download_testvectors.sh

      - name: Verify RFC 6716 Conformance (120 tests, fails if vectors missing)
        run: bash scripts/run_conformance.sh

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Build release notes from CHANGELOG.md
        # Fails the release if CHANGELOG.md has no section for this tag.
        # The tag name goes through the environment, never into the shell text.
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release_notes.sh "$TAG" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The changelog section above, followed by GitHub's generated "What's Changed" list.
          body_path: release_notes.md
          generate_release_notes: true

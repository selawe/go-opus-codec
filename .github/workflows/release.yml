name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Unit Tests
        run: go test -v ./...

      - name: Cache RFC 6716 test vectors
        uses: actions/cache@v4
        with:
          path: testvectors
          key: rfc6716-testvectors-${{ hashFiles('scripts/download_testvectors.sh') }}

      - name: Download & verify test vectors (no-op on cache hit)
        run: bash scripts/download_testvectors.sh

      - name: Verify RFC 6716 Conformance (120 tests, fails if vectors missing)
        run: bash scripts/run_conformance.sh

      - name: Build release notes from CHANGELOG.md
        # Fails the release if CHANGELOG.md has no section for this tag.
        run: bash scripts/release_notes.sh "${{ github.ref_name }}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The changelog section above, followed by GitHub's generated "What's Changed" list.
          body_path: release_notes.md
          generate_release_notes: true

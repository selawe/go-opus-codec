name: Scheduled Fuzzing

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target.pkg }} / ${{ matrix.target.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./opus, target: FuzzPacketFrames }
          - { pkg: ./opus, target: FuzzPacketTotalSamples }
          - { pkg: ./opus, target: FuzzPacketUnpad }
          - { pkg: ./opus, target: FuzzParsePacketTOC }
          - { pkg: ./opus, target: FuzzDecode }
          - { pkg: ./opus, target: FuzzDecodeF32 }
          - { pkg: ./opus, target: FuzzRepacketizer }
          - { pkg: ./ogg, target: FuzzOpusReader }
          - { pkg: ./ogg, target: FuzzPageReader }
          - { pkg: ./ogg, target: FuzzPacketReader }
          - { pkg: ./ogg, target: FuzzOpusReaderNoCRC }
          - { pkg: ./ogg, target: FuzzOpusHeaders }
          - { pkg: ./ogg, target: FuzzSeekAndLength }
          - { pkg: ./wav, target: FuzzNewReader }

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Fuzz Target
        run: go test -v -run=^$ -fuzz=${{ matrix.target.target }} -fuzztime=30s ${{ matrix.target.pkg }}

      # A failing input is written under testdata/fuzz; without this it disappears with the runner.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers-${{ matrix.target.target }}
          path: '**/testdata/fuzz/${{ matrix.target.target }}/*'
          if-no-files-found: ignore
